name: Label PRs

on:
  # pull_request_target, not pull_request: for a pull request from a fork,
  # pull_request gets a read-only token whatever the permissions block says,
  # and adding the labels fails with "Resource not accessible by integration".
  # This runs the workflow from the base branch with a writable token. That is
  # safe only because no step checks out or runs the pull request's code: the
  # labeler reads the changed file names through the API and the script below
  # reads only the title. Keep it that way.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Automatically label PRs by changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/pr-labeler.yml

      - name: Label bug based on PR title
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title.toLowerCase();
            if (/^fix[\s(:!]/.test(title)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['bug'],
              });
            }
