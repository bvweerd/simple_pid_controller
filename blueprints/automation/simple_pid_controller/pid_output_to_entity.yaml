blueprint:
  name: Simple PID Controller – send output to an entity
  description: >-
    Copies the PID Output (control output, CV / u) of a Simple PID Controller
    to a number, input_number or climate entity every time it changes.
    For a climate entity the output is used as its target temperature; only
    thermostats with a single target temperature are supported, so nothing is
    sent while a thermostat is in heat_cool mode.
    The value is clamped to the min/max of the target entity, and nothing is
    sent while the output is unknown (for example when Auto Mode is off).
  domain: automation
  source_url: https://github.com/bvweerd/simple_pid_controller/blob/dev/blueprints/automation/simple_pid_controller/pid_output_to_entity.yaml
  input:
    pid_output:
      name: PID Output sensor
      description: >-
        The PID Output sensor of the controller (entity ID ending in
        _pid_output), not one of the P/I/D contribution sensors.
      selector:
        entity:
          filter:
            - integration: simple_pid_controller
              domain: sensor
    target_entity:
      name: Target entity
      description: The entity that is controlled by the PID output.
      selector:
        entity:
          filter:
            - domain:
                - number
                - input_number
                - climate

mode: queued
max: 2

triggers:
  - trigger: state
    entity_id: !input pid_output
    # Only real state changes, not attribute-only updates.
    to: ~

variables:
  target: !input target_entity
  domain: "{{ target.split('.')[0] }}"
  min_attr: "{{ 'min_temp' if domain == 'climate' else 'min' }}"
  max_attr: "{{ 'max_temp' if domain == 'climate' else 'max' }}"
  value: >-
    {% set v = trigger.to_state.state | float(0) %}
    {% set lo = state_attr(target, min_attr) | float(v) %}
    {% set hi = state_attr(target, max_attr) | float(v) %}
    {{ [[v, lo] | max, hi] | min }}

conditions:
  - condition: template
    value_template: "{{ trigger.to_state.state | is_number }}"
  - condition: template
    value_template: "{{ states(target) not in ['unknown', 'unavailable'] }}"
  # climate.set_temperature with a single temperature needs the
  # TARGET_TEMPERATURE feature (1) and is rejected in heat_cool mode, which
  # takes a low and a high setpoint instead.
  - condition: template
    value_template: >-
      {{ domain != 'climate'
         or ((state_attr(target, 'supported_features') | int(0)) | bitwise_and(1) > 0
             and states(target) != 'heat_cool') }}

actions:
  - choose:
      - conditions: "{{ domain == 'climate' }}"
        sequence:
          - action: climate.set_temperature
            target:
              entity_id: "{{ target }}"
            data:
              temperature: "{{ value }}"
      - conditions: "{{ domain == 'input_number' }}"
        sequence:
          - action: input_number.set_value
            target:
              entity_id: "{{ target }}"
            data:
              value: "{{ value }}"
    default:
      - action: number.set_value
        target:
          entity_id: "{{ target }}"
        data:
          value: "{{ value }}"
