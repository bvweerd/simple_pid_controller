[coverage:run]
# The integration is what needs measuring, not the test suite. CI happened to
# mask this by passing --cov=custom_components on the command line, so a local
# `pytest --cov` reported coverage of tests/ instead.
source =
	custom_components/simple_pid_controller

[coverage:report]
exclude_lines =
	pragma: no cover
	raise NotImplemented()
	if __name__ == '__main__':
	main()
show_missing = true
# A floor against rot, not a target. The suite currently sits at 97%; without
# a threshold that number degrades silently.
fail_under = 90

[tool:pytest]
testpaths = tests
norecursedirs = .git
pythonpath = .
asyncio_default_fixture_loop_scope = function
asyncio_mode = auto
# --maxfail is deliberately absent: stopping at the first failure gives one
# error per CI run, so an unrelated break hides everything behind it. Add -x
# locally when you want fail-fast.
addopts =
	--disable-warnings -q
	-p syrupy
	--strict

[flake8]
max-line-length = 88
ignore =
	E501,
	W503,
	E203,
	D202,
	W504

[isort]
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
line_length = 88
indent = "    "
not_skip = __init__.py
force_sort_within_sections = true
sections = FUTURE,STDLIB,INBETWEENS,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
default_section = THIRDPARTY
known_first_party = custom_components,tests
forced_separate = tests
combine_as_imports = true

[mypy]
strict = true
# Must match the interpreter the lint job and the mypy pre-commit hook run on
# (language_version in .pre-commit-config.yaml). The standalone mypy step type
# checks against the real homeassistant package rather than the stubs, and Home
# Assistant's own source now uses Python 3.14 syntax (PEP 758 unparenthesised
# except expressions). Targeting 3.13 makes mypy reject that source outright:
#   homeassistant/helpers/device_registry.py:551: error: Except expressions
#   without parentheses are only supported in Python 3.14 and greater
python_version = 3.14
ignore_errors = false
# strict turns this on, but the project type checks twice against two
# different descriptions of Home Assistant: the pre-commit hook uses
# homeassistant-stubs, the lint job uses the real package. Where the stubs are
# thinner, an ignore that one run requires the other reports as unnecessary,
# and no single set of comments satisfies both. The ignores that remain are
# commented where they appear.
warn_unused_ignores = false
follow_imports = silent
ignore_missing_imports = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
